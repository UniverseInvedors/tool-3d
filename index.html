<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-base:#03050a;--bg-surface:#080d15;--bg-elevated:#0d1421;--bg-card:#111b2e;--bg-input:#0d1421;
  --text-1:#f0f4ff;--text-2:#a8b8cf;--text-3:#5a6a82;--text-4:#2e3d54;
  --accent:#3b82f6;--accent-light:#60a5fa;--accent-subtle:rgba(59,130,246,.12);
  --accent-border:rgba(59,130,246,.30);--accent-glow:rgba(59,130,246,.22);
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;--cyan:#06b6d4;--violet:#8b5cf6;
  --border:rgba(255,255,255,.07);--border-hover:rgba(255,255,255,.14);--border-focus:rgba(59,130,246,.50);
  --shadow-md:0 4px 16px rgba(0,0,0,.50);--shadow-lg:0 12px 40px rgba(0,0,0,.60);
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',Consolas,monospace;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:18px;
  --topbar-h:52px;--t:180ms cubic-bezier(.4,0,.2,1);
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-1);height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.20)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
/* TOPBAR */
.topbar{height:var(--topbar-h);background:rgba(3,5,10,.92);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.6rem;padding:0 1rem;flex-shrink:0;z-index:300}
.topbar-logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--text-1);flex-shrink:0;transition:opacity var(--t)}
.topbar-logo:hover{opacity:.8;text-decoration:none}
.topbar-logo-mark{width:26px;height:26px;border-radius:var(--r-sm);background:linear-gradient(135deg,#3b82f6,#06b6d4);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar-logo-mark svg{width:14px;height:14px}
.topbar-logo-text{display:flex;flex-direction:column;line-height:1}
.topbar-logo-company{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-1)}
.topbar-logo-tool{font-size:.67rem;font-weight:500;color:var(--text-3);margin-top:1px}
.topbar-sep{width:1px;height:18px;background:var(--border);flex-shrink:0}
.topbar-spacer,.sp{flex:1}
.badge-free{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .55rem;border-radius:9999px;font-size:.67rem;font-weight:700;background:rgba(16,185,129,.10);color:var(--green);border:1px solid rgba(16,185,129,.22)}
/* ENGINE TABS */
.etabs{display:flex;gap:.1rem;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r-md);padding:2px;overflow-x:auto;flex-shrink:1}
.et{display:inline-flex;align-items:center;gap:.3rem;padding:.26rem .7rem;border-radius:7px;font-size:.73rem;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text-3);white-space:nowrap;transition:all var(--t)}
.et:hover{background:rgba(255,255,255,.06);color:var(--text-2)}
.et.active{background:var(--accent);color:#fff;box-shadow:0 0 12px var(--accent-glow)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.38rem .85rem;border-radius:var(--r-md);font-size:.78rem;font-weight:600;cursor:pointer;border:none;transition:all var(--t);white-space:nowrap;font-family:var(--font-sans)}
.btn:active{transform:scale(.97)}
.btn svg{width:14px;height:14px;flex-shrink:0}
.bg,.btn-ghost{background:rgba(255,255,255,.05);color:var(--text-2);border:1px solid var(--border)}
.bg:hover,.btn-ghost:hover{background:rgba(255,255,255,.09);border-color:var(--border-hover);color:var(--text-1)}
.bp,.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px var(--accent-glow)}
.bp:hover,.btn-primary:hover{background:var(--accent-light);box-shadow:0 4px 20px var(--accent-glow)}
.bgr,.btn-success{background:var(--green);color:#000}
.bgr:hover,.btn-success:hover{background:#0ea371}
.bsm,.btn-sm{padding:.28rem .65rem;font-size:.72rem}
.btn-violet{background:var(--violet);color:#fff}.btn-violet:hover{background:#7c3aed}
.btn:disabled,.btn[disabled]{opacity:.4;cursor:not-allowed}
/* PANES */
.pane{display:flex;flex-direction:column;overflow:hidden}
.pane-head,.ph{display:flex;align-items:center;gap:.5rem;padding:.42rem 1rem;background:var(--bg-surface);border-bottom:1px solid var(--border);font-size:.69rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);flex-shrink:0}
.pd,.pane-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.phr,.pane-actions{margin-left:auto;display:flex;gap:.3rem}
/* FORM */
.fl,.field-label{font-size:.71rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin-bottom:.3rem;display:block}
.fi,input[type=text],input[type=number],select,textarea{width:100%;padding:.45rem .7rem;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text-1);font-size:.84rem;font-family:var(--font-sans);outline:none;transition:border-color var(--t),box-shadow var(--t)}
.fi:focus,input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.10)}
select option{background:var(--bg-elevated)}
input[type=range]{accent-color:var(--accent);width:100%}
/* CARDS */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.1rem 1.25rem}
.card:hover{border-color:var(--border-hover)}
/* TOASTS */
.toasts{position:fixed;bottom:1.25rem;right:1.25rem;z-index:999;display:flex;flex-direction:column;gap:.45rem;pointer-events:none}
.toast{display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;border-radius:var(--r-md);font-size:.8rem;font-weight:600;background:var(--bg-card);border:1px solid var(--border);color:var(--text-1);box-shadow:var(--shadow-lg);animation:toastIn .22s ease;pointer-events:auto}
.toast.ok{border-color:rgba(16,185,129,.35);color:var(--green)}.toast.err{border-color:rgba(239,68,68,.35);color:#f87171}.toast.info{border-color:var(--accent-border);color:var(--accent-light)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
/* SEO FOOTER */
.seo-footer,.tool-footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.4rem .9rem;padding:.6rem 1rem;border-top:1px solid var(--border);background:var(--bg-surface);font-size:.7rem;color:var(--text-3);flex-shrink:0}
.seo-footer a,.tool-footer a{color:var(--text-3)}.seo-footer a:hover,.tool-footer a:hover{color:var(--text-2);text-decoration:none}
.sf-links,.tool-footer-links{display:flex;flex-wrap:wrap;gap:.25rem .65rem}
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <a href="https://universeinvedors.tech/tools" class="topbar-logo" aria-label="All Tools">
    <div class="topbar-logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"/></svg>
    </div>
    <div class="topbar-logo-text">
      <span class="topbar-logo-company">Universe Invedors</span>
      <span class="topbar-logo-tool">3D Studio</span>
    </div>
  </a>
  <div class="topbar-sep"></div>
  <div class="etabs" id="etabs">
    <button class="et active" id="et-scene" onclick="switchEngine('scene')">Scene Builder</button>
    <button class="et" id="et-model" onclick="switchEngine('model')">Model Viewer</button>
    <button class="et" id="et-particle" onclick="switchEngine('particle')">Particle Lab</button>
    <button class="et" id="et-physics" onclick="switchEngine('physics')">Physics</button>
    <button class="et" id="et-xr" onclick="switchEngine('xr')">WebXR</button>
  </div>
  <div class="sp"></div>
  <div style="display:flex;gap:.35rem;align-items:center">
    <span id="fps-badge" style="font-size:.67rem;color:var(--t4);font-family:monospace">—fps</span>
    <button class="btn bg bsm" onclick="clearScene()">Clear</button>
    <button class="btn bp bsm" onclick="screenshot()">?? Screenshot</button>
  </div>
  <input type="file" id="model-input" accept=".glb,.gltf,.obj" style="display:none" onchange="loadModelFile(this.files[0])">
  <button class="tour-btn" onclick="startTour()" aria-label="Start guided tour" title="Take a quick tour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg> Tour</button>
</header>

<div class="main" id="main-wrap">

  <!-- -- SCENE BUILDER SIDEBAR --- -->
  <aside class="sidebar" id="scene-sidebar">
    <div class="sb-scroll">
      <div class="sec">Add Shape</div>
      <div class="sg" id="shape-grid">
        <div class="sh" onclick="addShape('box')" title="Box">?</div>
        <div class="sh" onclick="addShape('sphere')" title="Sphere">?</div>
        <div class="sh" onclick="addShape('cylinder')" title="Cylinder">??</div>
        <div class="sh" onclick="addShape('torus')" title="Torus">?</div>
        <div class="sh" onclick="addShape('cone')" title="Cone">??</div>
        <div class="sh" onclick="addShape('tetra')" title="Tetrahedron">?</div>
        <div class="sh" onclick="addShape('octa')" title="Octahedron">?</div>
        <div class="sh" onclick="addShape('tknot')" title="Torus Knot">8</div>
        <div class="sh" onclick="addShape('icosa')" title="Icosahedron">?</div>
        <div class="sh" onclick="addRandomShape()" title="Random">??</div>
      </div>

      <div class="sec">Material</div>
      <button class="mb sel" id="mat-standard" onclick="setMaterial('standard')">Standard</button>
      <button class="mb" id="mat-wireframe" onclick="setMaterial('wireframe')">Wireframe</button>
      <button class="mb" id="mat-normal" onclick="setMaterial('normal')">Normal Map</button>
      <button class="mb" id="mat-phong" onclick="setMaterial('phong')">Phong</button>
      <button class="mb" id="mat-physical" onclick="setMaterial('physical')">Physical (PBR)</button>

      <div class="sec" id="col-sec">Color</div>
      <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.55rem" id="col-wrap">
        <input type="color" id="shape-color" value="#f97316" onchange="setColor(this.value)" style="flex:1;height:32px">
        <span id="col-hex" style="font-size:.72rem;color:var(--t2);font-family:monospace">#f97316</span>
      </div>

      <div class="sec">Lighting</div>
      <div class="sr"><div class="srh"><span class="srl">Ambient</span><span class="srv" id="v-amb">50%</span></div><input type="range" min="0" max="200" value="50" oninput="setAmbient(this.value)"></div>
      <div class="sr"><div class="srh"><span class="srl">Point Light</span><span class="srv" id="v-pt">150%</span></div><input type="range" min="0" max="300" value="150" oninput="setPtLight(this.value)"></div>

      <div class="sec">Scene</div>
      <div class="sr"><div class="srh"><span class="srl">Scale</span><span class="srv" id="v-scale">1.0</span></div><input type="range" min="0.2" max="4" step="0.1" value="1" oninput="setScale(this.value)"></div>
      <div class="sr"><div class="srh"><span class="srl">Background</span></div><input type="color" id="bg-col" value="#090c13" onchange="setBg(this.value)"></div>
      <div class="toggle-row"><span class="tgl-label">Grid</span><label class="tgl"><input type="checkbox" id="tgl-grid" checked onchange="toggleGrid(this.checked)"><div class="tgl-track"></div><div class="tgl-thumb"></div></label></div>
      <div class="toggle-row"><span class="tgl-label">Auto-rotate</span><label class="tgl"><input type="checkbox" id="tgl-rot" checked onchange="setAutoRot(this.checked)"><div class="tgl-track"></div><div class="tgl-thumb"></div></label></div>
      <div class="toggle-row"><span class="tgl-label">Shadows</span><label class="tgl"><input type="checkbox" id="tgl-shadow" checked onchange="toggleShadows(this.checked)"><div class="tgl-track"></div><div class="tgl-thumb"></div></label></div>

      <div class="sec">Objects <span style="float:right;font-size:.65rem;color:var(--t3)" id="obj-count">0</span></div>
      <div id="obj-list" class="obj-list"><p style="font-size:.72rem;color:var(--t4);text-align:center;padding:.5rem 0">No objects yet</p></div>
    </div>
  </aside>

  <!-- -- CANVAS / ENGINE AREA --- -->
  <div class="cv-area" id="cv-area">

    <!-- Scene Builder Canvas -->
    <canvas id="c" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
    <div class="load-ov" id="load-ov"><div class="spinner"></div><p style="font-size:.85rem;color:var(--t3)">Loading Three.js…</p></div>

    <!-- Model Viewer -->
    <div id="mv-wrap">
      <div class="mv-drop" id="mv-drop"
        onclick="document.getElementById('model-input').click()"
        ondragover="event.preventDefault();this.classList.add('drag')"
        ondragleave="this.classList.remove('drag')"
        ondrop="event.preventDefault();this.classList.remove('drag');loadModelFile(event.dataTransfer.files[0])">
        <div style="font-size:3rem;margin-bottom:.75rem">??</div>
        <h2 style="font-size:.95rem;font-weight:700;margin-bottom:.35rem">Drop a GLB or GLTF file here</h2>
        <p style="font-size:.8rem;color:var(--t2)">Load your 3D model — orbit, zoom, inspect animations</p>
        <p style="margin-top:.5rem;font-size:.72rem;color:var(--t3)">or click to browse files</p>
      </div>
      <model-viewer id="mv" style="width:100%;height:100%;display:none;background:#090c13" camera-controls auto-rotate shadow-intensity="1" exposure="0.8"></model-viewer>
    </div>

    <!-- Particle Lab -->
    <div id="particle-wrap">
      <div class="preset-grid">
        <div class="preset-btn active" id="pp-galaxy" onclick="setParticlePreset('galaxy')">?? Galaxy</div>
        <div class="preset-btn" id="pp-snow" onclick="setParticlePreset('snow')">? Snow</div>
        <div class="preset-btn" id="pp-fire" onclick="setParticlePreset('fire')">?? Fire</div>
        <div class="preset-btn" id="pp-matrix" onclick="setParticlePreset('matrix')">?? Matrix</div>
        <div class="preset-btn" id="pp-dna" onclick="setParticlePreset('dna')">?? DNA</div>
        <div class="preset-btn" id="pp-stars" onclick="setParticlePreset('stars')">? Stars</div>
      </div>
      <div style="padding:0 .65rem;display:flex;flex-wrap:wrap;gap:.6rem">
        <div style="flex:1;min-width:140px">
          <div class="sr"><div class="srh"><span class="srl">Particle Count</span><span class="srv" id="v-pcount">5000</span></div><input type="range" id="r-pcount" min="500" max="30000" step="500" value="5000" oninput="updateParticleSettings()"></div>
          <div class="sr"><div class="srh"><span class="srl">Size</span><span class="srv" id="v-psize">2</span></div><input type="range" id="r-psize" min="0.5" max="8" step="0.5" value="2" oninput="updateParticleSettings()"></div>
          <div class="sr"><div class="srh"><span class="srl">Speed</span><span class="srv" id="v-pspeed">1.0</span></div><input type="range" id="r-pspeed" min="0.1" max="5" step="0.1" value="1" oninput="updateParticleSettings()"></div>
        </div>
      </div>
      <canvas id="particle-canvas" style="position:absolute;inset:0;width:100%;height:100%;display:none"></canvas>
    </div>

    <!-- Physics -->
    <div id="physics-wrap">
      <div class="demo-grid">
        <div class="demo-btn active" id="pd-stack" onclick="setPhysicsDemo('stack')">?? Box Stack</div>
        <div class="demo-btn" id="pd-rain" onclick="setPhysicsDemo('rain')">?? Sphere Rain</div>
        <div class="demo-btn" id="pd-domino" onclick="setPhysicsDemo('domino')">?? Dominos</div>
        <div class="demo-btn" id="pd-click" onclick="setPhysicsDemo('click')">?? Click to Add</div>
      </div>
      <canvas id="physics-canvas" style="position:absolute;inset:0;width:100%;height:100%;display:none"></canvas>
    </div>

    <!-- WebXR -->
    <div id="xr-wrap">
      <div style="font-size:3rem;margin-bottom:1rem">??</div>
      <h2 style="font-size:1.1rem;font-weight:700;margin-bottom:.5rem">WebXR — AR &amp; VR</h2>
      <p style="font-size:.85rem;color:var(--t2);max-width:380px;margin-bottom:1.25rem;line-height:1.6" id="xr-msg">Checking device support…</p>
      <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap">
        <button class="btn" id="btn-ar" style="background:var(--green);color:#000;font-size:.88rem;padding:.6rem 1.5rem;display:none" onclick="enterXR('immersive-ar')">Enter AR</button>
        <button class="btn" id="btn-vr" style="background:var(--violet);color:#fff;font-size:.88rem;padding:.6rem 1.5rem;display:none" onclick="enterXR('immersive-vr')">Enter VR</button>
      </div>
      <div style="margin-top:1.5rem;text-align:left;max-width:420px">
        <p style="font-size:.78rem;font-weight:700;color:var(--t3);margin-bottom:.5rem">REQUIREMENTS</p>
        <ul style="font-size:.78rem;color:var(--t2);line-height:2;padding-left:1.25rem">
          <li>AR: Android Chrome with ARCore, or iOS Safari 15.4+</li>
          <li>VR: Meta Quest browser, or desktop Chrome/Edge with headset</li>
          <li>HTTPS required (this site uses HTTPS ?)</li>
          <li>Camera permission for AR mode</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- -- RIGHT PANEL (object properties) --- -->
  <aside class="right-panel" id="right-panel">
    <div style="font-size:.65rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--t4);padding:.2rem 0 .4rem">Properties</div>
    <p id="rp-hint" style="font-size:.72rem;color:var(--t3)">Click an object in the list to edit its properties.</p>
    <div id="rp-fields" style="display:none">
      <div class="sec" style="padding-top:.25rem">Position</div>

<!-- -- ALL LOGIC IN A SINGLE REGULAR <script> -----------------------------
     CRITICAL: NOT type="module" — so onclick attributes can call functions  -->
<script>
/* -- GLOBALS ---------------------------------------------------- */
var THREE_MODULE = null   // loaded async
var scene, camera, renderer, controls
var ambientLight, ptLight, blueLight, dirLight
var grid, groundMesh
var objects = []           // {id, name, mesh, type}
var selectedObj = null
var currentShape = 'box'
var currentMat = 'standard'
var currentColor = '#f97316'
var autoRotEnabled = true
var frameCount = 0, lastFPS = performance.now()
var frameId = 0
var currentEngine = 'scene'
var sceneReady = false

// Particle state
var particleScene, particleCamera, particleRenderer, particlePoints
var particleFrameId = 0
var currentParticlePreset = 'galaxy'
var particleSpeed = 1.0
var particleAnimId = 0

// Physics state
var physicsFrameId = 0
var physicsDemo = 'stack'

/* -- ENGINE SWITCHER (called from onclick) ---------------------- */
function switchEngine(eng) {
  currentEngine = eng

  // Update tab buttons
  document.querySelectorAll('.et').forEach(function(t) { t.classList.remove('active') })
  var btn = document.getElementById('et-' + eng)
  if (btn) btn.classList.add('active')

  // Show/hide panels
  var sceneCanvas = document.getElementById('c')
  var mvWrap = document.getElementById('mv-wrap')
  var particleWrap = document.getElementById('particle-wrap')
  var physicsWrap = document.getElementById('physics-wrap')
  var xrWrap = document.getElementById('xr-wrap')
  var sceneSidebar = document.getElementById('scene-sidebar')
  var rightPanel = document.getElementById('right-panel')

  // Hide all engine panels
  sceneCanvas.style.display = 'none'
  mvWrap.style.display = 'none'
  particleWrap.style.display = 'none'
  physicsWrap.style.display = 'none'
  xrWrap.style.display = 'none'
  sceneSidebar.style.display = 'none'
  rightPanel.style.display = 'none'

  // Cancel any running loops
  cancelAnimationFrame(particleAnimId)
  cancelAnimationFrame(physicsFrameId)

  document.getElementById('sb-engine').textContent = {
    scene:'Scene Builder', model:'Model Viewer', particle:'Particle Lab',
    physics:'Physics Demo', xr:'WebXR'
  }[eng] || eng

  if (eng === 'scene') {
    sceneCanvas.style.display = 'block'
    sceneSidebar.style.display = 'flex'
    rightPanel.style.display = 'flex'
    if (sceneReady) { cancelAnimationFrame(frameId); animateScene() }
  } else if (eng === 'model') {
    mvWrap.style.display = 'flex'
    mvWrap.style.flexDirection = 'column'
  } else if (eng === 'particle') {
    particleWrap.style.display = 'flex'
    particleWrap.style.flexDirection = 'column'
    startParticles()
  } else if (eng === 'physics') {
    physicsWrap.style.display = 'flex'
    physicsWrap.style.flexDirection = 'column'
    startPhysics()
  } else if (eng === 'xr') {
    xrWrap.style.display = 'flex'
    xrWrap.style.flexDirection = 'column'
    xrWrap.style.alignItems = 'center'
    xrWrap.style.justifyContent = 'center'
    checkXR()
  }
}

/* -- THREE.JS SCENE BUILDER ------------------------------------ */
function initScene(THREE, OrbitControls) {
  var canvas = document.getElementById('c')
  var wrap = document.getElementById('cv-area')

  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true })
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
  renderer.setSize(wrap.clientWidth, wrap.clientHeight)
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.PCFSoftShadowMap

  scene = new THREE.Scene()
  scene.background = new THREE.Color('#090c13')

  camera = new THREE.PerspectiveCamera(60, wrap.clientWidth / wrap.clientHeight, 0.1, 1000)
  camera.position.set(0, 2.5, 6)

  controls = new OrbitControls(camera, canvas)
  controls.enableDamping = true
  controls.dampingFactor = 0.05
  controls.autoRotate = true
  controls.autoRotateSpeed = 0.8

  // Lights
  ambientLight = new THREE.AmbientLight(0xffffff, 0.5)
  scene.add(ambientLight)

  dirLight = new THREE.DirectionalLight(0xffffff, 1.2)
  dirLight.position.set(5, 8, 5)
  dirLight.castShadow = true
  scene.add(dirLight)

  ptLight = new THREE.PointLight(0xf97316, 1.5, 25)
  ptLight.position.set(-4, 5, 3)
  scene.add(ptLight)

  blueLight = new THREE.PointLight(0x3b82f6, 0.8, 18)
  blueLight.position.set(4, -2, -4)
  scene.add(blueLight)

  // Grid
  grid = new THREE.GridHelper(20, 30, 0x1e2535, 0x1e2535)
  scene.add(grid)

  // Shadow floor
  groundMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.ShadowMaterial({ opacity: 0.15, transparent: true })
  )
  groundMesh.rotation.x = -Math.PI / 2
  groundMesh.position.y = -1.8
  groundMesh.receiveShadow = true
  scene.add(groundMesh)

  // Resize handler
  new ResizeObserver(function() {
    var w = wrap.clientWidth, h = wrap.clientHeight
    renderer.setSize(w, h)
    camera.aspect = w / h
    camera.updateProjectionMatrix()
  }).observe(wrap)

  document.getElementById('load-ov').style.display = 'none'
  sceneReady = true
  animateScene()
  toast('Three.js ready', 'ok')
}

function animateScene() {
  if (currentEngine !== 'scene') return
  frameId = requestAnimationFrame(animateScene)
  controls.update()
  renderer.render(scene, camera)

  // FPS
  frameCount++
  var now = performance.now()
  if (now - lastFPS >= 1000) {
    document.getElementById('fps-badge').textContent = Math.round(frameCount * 1000 / (now - lastFPS)) + 'fps'
    frameCount = 0; lastFPS = now
  }
}

function buildGeo(THREE, shape) {
  var geos = {
    box:      function() { return new THREE.BoxGeometry(1.5, 1.5, 1.5) },
    sphere:   function() { return new THREE.SphereGeometry(0.9, 32, 32) },
    cylinder: function() { return new THREE.CylinderGeometry(0.7, 0.7, 1.6, 32) },
    torus:    function() { return new THREE.TorusGeometry(0.8, 0.32, 16, 100) },
    cone:     function() { return new THREE.ConeGeometry(0.8, 1.6, 32) },
    tetra:    function() { return new THREE.TetrahedronGeometry(1) },
    octa:     function() { return new THREE.OctahedronGeometry(1) },
    tknot:    function() { return new THREE.TorusKnotGeometry(0.6, 0.2, 100, 16) },
    icosa:    function() { return new THREE.IcosahedronGeometry(1) },
  }
  return (geos[shape] || geos.box)()
}

function buildMat(THREE, mat, color) {
  var c = color || currentColor
  var mats = {
    standard:  function() { return new THREE.MeshStandardMaterial({ color: c, metalness: 0.2, roughness: 0.5 }) },
    wireframe: function() { return new THREE.MeshBasicMaterial({ color: c, wireframe: true }) },
    normal:    function() { return new THREE.MeshNormalMaterial() },
    phong:     function() { return new THREE.MeshPhongMaterial({ color: c, shininess: 80 }) },
    physical:  function() { return new THREE.MeshPhysicalMaterial({ color: c, metalness: 0.8, roughness: 0.1, clearcoat: 1 }) },
  }
  return (mats[mat] || mats.standard)()
}

function addShape(shape) {
  if (!THREE_MODULE || !sceneReady) { toast('Scene loading…', 'err'); return }
  var THREE = THREE_MODULE
  var geo = buildGeo(THREE, shape)
  var mat = buildMat(THREE, currentMat, currentColor)
  var mesh = new THREE.Mesh(geo, mat)
  var spread = 3
  mesh.position.set(
    (Math.random() - 0.5) * spread,
    0.8 + Math.random() * 1.5,
    (Math.random() - 0.5) * spread
  )
  mesh.castShadow = true; mesh.receiveShadow = true
  scene.add(mesh)
  var id = Date.now()
  objects.push({ id: id, name: shape + ' ' + objects.length, mesh: mesh, type: shape })
  renderObjList()
  document.getElementById('sb-obj').textContent = objects.length + ' object' + (objects.length !== 1 ? 's' : '')
  toast('Added ' + shape, 'info')
}

function addRandomShape() {
  var shapes = ['box', 'sphere', 'cylinder', 'torus', 'cone', 'tetra', 'octa', 'tknot', 'icosa']
  addShape(shapes[Math.floor(Math.random() * shapes.length)])
}

function setMaterial(mat) {
  currentMat = mat
  document.querySelectorAll('.mb').forEach(function(b) { b.classList.remove('sel') })
  var btn = document.getElementById('mat-' + mat)
  if (btn) btn.classList.add('sel')
  document.getElementById('col-sec').style.display = mat === 'normal' ? 'none' : 'block'
  document.getElementById('col-wrap').style.display = mat === 'normal' ? 'none' : 'flex'
  // Update selected object if any
  if (selectedObj && THREE_MODULE) {
    selectedObj.mesh.material = buildMat(THREE_MODULE, mat, currentColor)
  }
}

function setColor(c) {
  currentColor = c
  document.getElementById('col-hex').textContent = c
  if (selectedObj && currentMat !== 'normal' && selectedObj.mesh.material.color) {
    selectedObj.mesh.material.color.set(c)
  }
}

function setAmbient(v) { if (ambientLight) ambientLight.intensity = v / 100; document.getElementById('v-amb').textContent = Math.round(v) + '%' }
function setPtLight(v) { if (ptLight) ptLight.intensity = v / 100; document.getElementById('v-pt').textContent = Math.round(v) + '%' }
function setScale(v) {
  document.getElementById('v-scale').textContent = parseFloat(v).toFixed(1)
  if (selectedObj) selectedObj.mesh.scale.setScalar(parseFloat(v))
}
function setBg(v) { if (scene) scene.background = new THREE_MODULE.Color(v) }
function toggleGrid(v) { if (grid) grid.visible = v }
function setAutoRot(v) { if (controls) controls.autoRotate = v }
function toggleShadows(v) { if (renderer) renderer.shadowMap.enabled = v; if (dirLight) dirLight.castShadow = v }

function renderObjList() {
  var el = document.getElementById('obj-list')
  document.getElementById('obj-count').textContent = objects.length
  if (!objects.length) {
    el.innerHTML = '<p style="font-size:.72rem;color:var(--t4);text-align:center;padding:.5rem 0">No objects</p>'
    return
  }
  el.innerHTML = objects.map(function(o) {
    return '<div class="obj-item' + (selectedObj && selectedObj.id === o.id ? ' sel' : '') + '" onclick="selectObj(' + o.id + ')">' +
      '<span>' + o.name + '</span>' +
      '<button class="obj-del" onclick="event.stopPropagation();deleteObj(' + o.id + ')">?</button>' +
      '</div>'
  }).join('')
}

function selectObj(id) {
  selectedObj = objects.find(function(o) { return o.id === id }) || null
  renderObjList()
  var fields = document.getElementById('rp-fields')
  var hint = document.getElementById('rp-hint')
  if (selectedObj) {
    fields.style.display = 'block'
    hint.style.display = 'none'
    var p = selectedObj.mesh.position, r = selectedObj.mesh.rotation
    document.getElementById('px').value = p.x.toFixed(2)
    document.getElementById('py').value = p.y.toFixed(2)
    document.getElementById('pz').value = p.z.toFixed(2)
    document.getElementById('rx').value = (r.x * 180 / Math.PI).toFixed(1)
    document.getElementById('ry').value = (r.y * 180 / Math.PI).toFixed(1)
    document.getElementById('rz').value = (r.z * 180 / Math.PI).toFixed(1)
    var s = selectedObj.mesh.scale.x
    document.getElementById('r-sel-scale').value = s
    document.getElementById('v-sel-scale').textContent = s.toFixed(1)
  } else {
    fields.style.display = 'none'
    hint.style.display = 'block'
  }
}

function applyTransform() {
  if (!selectedObj) return
  var px = parseFloat(document.getElementById('px').value) || 0
  var py = parseFloat(document.getElementById('py').value) || 0
  var pz = parseFloat(document.getElementById('pz').value) || 0
  var rx = parseFloat(document.getElementById('rx').value) || 0
  var ry = parseFloat(document.getElementById('ry').value) || 0
  var rz = parseFloat(document.getElementById('rz').value) || 0
  var PI = Math.PI
  selectedObj.mesh.position.set(px, py, pz)
  selectedObj.mesh.rotation.set(rx * PI / 180, ry * PI / 180, rz * PI / 180)
}

function setSelScale(v) {
  document.getElementById('v-sel-scale').textContent = parseFloat(v).toFixed(1)
  if (selectedObj) selectedObj.mesh.scale.setScalar(parseFloat(v))
}

function deleteSelected() { if (selectedObj) deleteObj(selectedObj.id) }
function deleteObj(id) {
  var idx = objects.findIndex(function(o) { return o.id === id })
  if (idx === -1) return
  scene.remove(objects[idx].mesh)
  objects.splice(idx, 1)
  if (selectedObj && selectedObj.id === id) {
    selectedObj = null
    document.getElementById('rp-fields').style.display = 'none'
    document.getElementById('rp-hint').style.display = 'block'
  }
  renderObjList()
  document.getElementById('sb-obj').textContent = objects.length + ' objects'
}

function clearScene() {
  objects.forEach(function(o) { scene && scene.remove(o.mesh) })
  objects = []; selectedObj = null
  renderObjList()
  document.getElementById('sb-obj').textContent = '0 objects'
  document.getElementById('rp-fields').style.display = 'none'
  document.getElementById('rp-hint').style.display = 'block'
  toast('Scene cleared', 'ok')
}

function screenshot() {
  if (currentEngine === 'scene' && renderer) {
    renderer.render(scene, camera)
    var a = document.createElement('a'); a.download = '3d-scene.png'; a.href = renderer.domElement.toDataURL(); a.click()
    toast('Screenshot saved', 'ok')
  } else {
    toast('Switch to Scene Builder for screenshots', 'info')
  }
}

/* -- MODEL VIEWER -------------------------------------------- */
function loadModelFile(file) {
  if (!file) return
  var ext = file.name.split('.').pop().toLowerCase()
  if (!['glb','gltf','obj'].includes(ext)) { toast('Only GLB, GLTF and OBJ files supported', 'err'); return }
  var mv = document.getElementById('mv')
  var drop = document.getElementById('mv-drop')
  mv.src = URL.createObjectURL(file)
  mv.style.display = 'block'
  drop.style.display = 'none'
  mv.addEventListener('load', function() { toast('Model loaded: ' + file.name, 'ok') }, { once: true })
  mv.addEventListener('error', function() { toast('Failed to load model', 'err'); mv.style.display = 'none'; drop.style.display = 'flex' }, { once: true })
}

/* -- PARTICLE LAB -------------------------------------------- */
var pCanvas, pCtx, pW, pH, pParticles = [], pAnimId = 0

var PARTICLE_PRESETS = {
  galaxy: { count: 5000, color1: '#3b82f6', color2: '#8b5cf6', spread: 180 },
  snow:   { count: 2000, color1: '#e2e8f0', color2: '#bfdbfe', spread: 50 },
  fire:   { count: 3000, color1: '#f97316', color2: '#ef4444', spread: 30 },
  matrix: { count: 150,  color1: '#10b981', color2: '#06b6d4', spread: 0 },
  dna:    { count: 2000, color1: '#a78bfa', color2: '#34d399', spread: 0 },
  stars:  { count: 8000, color1: '#f0f4ff', color2: '#60a5fa', spread: 200 },
}

function setParticlePreset(name) {
  currentParticlePreset = name
  document.querySelectorAll('.preset-btn').forEach(function(b) { b.classList.remove('active') })
  var btn = document.getElementById('pp-' + name)
  if (btn) btn.classList.add('active')
  startParticles()
}

function startParticles() {
  cancelAnimationFrame(pAnimId)
  pCanvas = document.getElementById('particle-canvas')
  pCtx = pCanvas.getContext('2d')
  var wrap = document.getElementById('cv-area')
  pW = pCanvas.width = wrap.clientWidth
  pH = pCanvas.height = wrap.clientHeight
  pCanvas.style.display = 'block'

  var preset = PARTICLE_PRESETS[currentParticlePreset] || PARTICLE_PRESETS.galaxy
  var count = parseInt(document.getElementById('r-pcount').value) || 5000
  pParticles = []

  if (currentParticlePreset === 'matrix') {
    initMatrix()
    return
  }

  for (var i = 0; i < count; i++) {
    pParticles.push(createParticle(preset))
  }
  animateParticles()
}

function createParticle(preset) {
  var p = {
    x: Math.random() * pW,
    y: Math.random() * pH,
    size: Math.random() * 2.5 + 0.5,
    speedX: (Math.random() - 0.5) * 0.6,
    speedY: 0,
    life: Math.random(),
    color: Math.random() > 0.5 ? preset.color1 : preset.color2,
    opacity: Math.random() * 0.8 + 0.2,
  }
  if (currentParticlePreset === 'snow') p.speedY = Math.random() * 1.5 + 0.5
  if (currentParticlePreset === 'fire') { p.speedY = -(Math.random() * 2 + 1); p.y = pH - Math.random() * 80 }
  if (currentParticlePreset === 'galaxy') {
    var angle = Math.random() * Math.PI * 2, r = Math.random() * Math.min(pW, pH) * 0.4
    p.x = pW / 2 + Math.cos(angle) * r + (Math.random() - 0.5) * 40
    p.y = pH / 2 + Math.sin(angle) * r * 0.4 + (Math.random() - 0.5) * 20
    p.speedX = -Math.sin(angle) * 0.3 * particleSpeed
    p.speedY = Math.cos(angle) * 0.12 * particleSpeed
  }
  if (currentParticlePreset === 'stars') { p.speedX = 0; p.speedY = 0; p.twinkle = Math.random() * Math.PI * 2 }
  if (currentParticlePreset === 'dna') {
    var t = (i / 2000) * Math.PI * 8
    p.t = t; p.offset = Math.random() > 0.5 ? 0 : Math.PI
    p.baseY = pH / 2
  }
  return p
}

var matrixCols = [], matrixFont = 14
function initMatrix() {
  matrixCols = []
  var cols = Math.floor(pW / matrixFont)
  for (var i = 0; i < cols; i++) matrixCols.push(Math.floor(Math.random() * pH / matrixFont) * -1)
  animateMatrix()
}

function animateMatrix() {
  if (currentEngine !== 'particle') return
  pAnimId = requestAnimationFrame(animateMatrix)
  pCtx.fillStyle = 'rgba(9,12,19,0.08)'
  pCtx.fillRect(0, 0, pW, pH)
  pCtx.fillStyle = '#10b981'
  pCtx.font = matrixFont + 'px monospace'
  var chars = '01??????????'
  for (var i = 0; i < matrixCols.length; i++) {
    var ch = chars[Math.floor(Math.random() * chars.length)]
    pCtx.fillText(ch, i * matrixFont, matrixCols[i] * matrixFont)
    if (matrixCols[i] * matrixFont > pH && Math.random() > 0.975) matrixCols[i] = 0
    matrixCols[i]++
  }
}

function animateParticles() {
  if (currentEngine !== 'particle') return
  pAnimId = requestAnimationFrame(animateParticles)
  var speed = parseFloat(document.getElementById('r-pspeed').value) || 1
  var size = parseFloat(document.getElementById('r-psize').value) || 2
  pCtx.fillStyle = 'rgba(9,12,19,0.18)'
  pCtx.fillRect(0, 0, pW, pH)

  for (var i = 0; i < pParticles.length; i++) {
    var p = pParticles[i]
    p.x += p.speedX * speed; p.y += p.speedY * speed
    if (currentParticlePreset === 'stars' && p.twinkle !== undefined) {
      p.twinkle += 0.04; p.opacity = 0.3 + Math.sin(p.twinkle) * 0.7
    }
    if (currentParticlePreset === 'dna') {
      p.t += 0.015 * speed
      p.x = pW / 2 + Math.cos(p.t + p.offset) * 120
      p.y = p.baseY + Math.sin(p.t * 0.5) * pH * 0.35
    }
    // Wrap
    if (p.x < 0) p.x = pW; if (p.x > pW) p.x = 0
    if (p.y < 0) p.y = pH; if (p.y > pH) p.y = 0
    if (currentParticlePreset === 'fire' && p.y < pH * 0.2) { p.y = pH - Math.random() * 80; p.opacity = Math.random() * 0.8 + 0.2 }

    pCtx.beginPath()
    pCtx.arc(p.x, p.y, p.size * size * 0.5, 0, Math.PI * 2)
    pCtx.globalAlpha = p.opacity
    pCtx.fillStyle = p.color
    pCtx.fill()
  }
  pCtx.globalAlpha = 1
}

function updateParticleSettings() {
  document.getElementById('v-pcount').textContent = document.getElementById('r-pcount').value
  document.getElementById('v-psize').textContent = parseFloat(document.getElementById('r-psize').value).toFixed(1)
  document.getElementById('v-pspeed').textContent = parseFloat(document.getElementById('r-pspeed').value).toFixed(1)
  particleSpeed = parseFloat(document.getElementById('r-pspeed').value)
  startParticles() // rebuild particles with new count
}

/* -- PHYSICS (using cannon-es UMD build) ----------------------- */
var physWorld, physBodies = [], physMeshes = []
var physScene, physCamera, physRenderer, physControls

function setPhysicsDemo(name) {
  physicsDemo = name
  document.querySelectorAll('.demo-btn').forEach(function(b) { b.classList.remove('active') })
  var btn = document.getElementById('pd-' + name)
  if (btn) btn.classList.add('active')
  startPhysics()
}

function startPhysics() {
  cancelAnimationFrame(physicsFrameId)
  // Load cannon-es UMD (not ES module) — correct CDN path
  if (window.CANNON) {
    initPhysicsScene()
  } else {
    var s = document.createElement('script')
    s.src = 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js'
    s.onload = function() { if (window.CANNON) initPhysicsScene(); else toast('Physics unavailable', 'err') }
    s.onerror = function() { toast('Could not load physics engine', 'err') }
    document.head.appendChild(s)
  }
}

function initPhysicsScene() {
  if (!THREE_MODULE) { toast('3D engine still loading…', 'err'); return }
  var THREE = THREE_MODULE
  var pCanvas = document.getElementById('physics-canvas')
  var wrap = document.getElementById('cv-area')

  pCanvas.style.display = 'block'
  if (physRenderer) physRenderer.dispose()

  physRenderer = new THREE.WebGLRenderer({ canvas: pCanvas, antialias: true })
  physRenderer.setSize(wrap.clientWidth, wrap.clientHeight)
  physRenderer.shadowMap.enabled = true

  physScene = new THREE.Scene()
  physScene.background = new THREE.Color('#090c13')

  physCamera = new THREE.PerspectiveCamera(60, wrap.clientWidth / wrap.clientHeight, 0.1, 200)
  physCamera.position.set(0, 8, 16)

  physControls = new window.__OrbitControls(physCamera, pCanvas)
  physControls.enableDamping = true

  physScene.add(new THREE.AmbientLight(0xffffff, 0.5))
  var dl = new THREE.DirectionalLight(0xffffff, 1.5)
  dl.position.set(5, 10, 5); dl.castShadow = true
  physScene.add(dl)

  var grd = new THREE.GridHelper(30, 30, 0x1e2535, 0x1e2535)
  physScene.add(grd)

  // Physics world
  physWorld = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) })
  physBodies = []; physMeshes = []

  // Ground
  var groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() })
  groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0)
  physWorld.addBody(groundBody)
  var groundVis = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.2, transparent: true }))
  groundVis.rotation.x = -Math.PI / 2; groundVis.receiveShadow = true
  physScene.add(groundVis)

  if (physicsDemo === 'stack') buildBoxStack()
  else if (physicsDemo === 'rain') startSphereRain()
  else if (physicsDemo === 'domino') buildDominos()
  else if (physicsDemo === 'click') setupClickToAdd()

  animatePhysics()
}

function addPhysicsBox(x, y, z, w, h, d, color) {
  var THREE = THREE_MODULE
  var mat = new THREE.MeshStandardMaterial({ color: color || '#f97316', metalness: 0.2, roughness: 0.6 })
  var mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat)
  mesh.castShadow = true; mesh.receiveShadow = true
  physScene.add(mesh)
  var body = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)) })
  body.position.set(x, y, z)
  physWorld.addBody(body)
  physBodies.push(body); physMeshes.push(mesh)
}

function buildBoxStack() {
  var colors = ['#f97316','#3b82f6','#10b981','#8b5cf6','#f59e0b']
  for (var row = 0; row < 5; row++)
    for (var col = 0; col < (5 - row); col++)
      addPhysicsBox(-2 + col * 1.05 + row * 0.525, 0.5 + row * 1.05, 0, 1, 1, 1, colors[row % colors.length])
}

var rainTimer
function startSphereRain() {
  clearInterval(rainTimer)
  rainTimer = setInterval(function() {
    if (currentEngine !== 'physics' || physicsDemo !== 'rain') { clearInterval(rainTimer); return }
    var THREE = THREE_MODULE
    var x = (Math.random() - 0.5) * 8, z = (Math.random() - 0.5) * 8
    var color = ['#06b6d4','#8b5cf6','#f97316','#10b981'][Math.floor(Math.random() * 4)]
    var mesh = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshStandardMaterial({ color: color, metalness: 0.3, roughness: 0.4 }))
    mesh.castShadow = true; physScene.add(mesh)
    var body = new CANNON.Body({ mass: 1, shape: new CANNON.Sphere(0.4) })
    body.position.set(x, 14, z)
    physWorld.addBody(body)
    physBodies.push(body); physMeshes.push(mesh)
    if (physBodies.length > 60) {
      physWorld.removeBody(physBodies.shift()); physScene.remove(physMeshes.shift())
    }
  }, 300)
}

function buildDominos() {
  for (var i = 0; i < 15; i++)
    addPhysicsBox(-7 + i, 0.6, 0, 0.3, 1.2, 0.7, ['#3b82f6','#10b981'][i % 2])
  // Give first domino a push
  setTimeout(function() { if (physBodies[0]) physBodies[0].applyImpulse(new CANNON.Vec3(4, 0, 0), new CANNON.Vec3(0, 0.5, 0)) }, 800)
}

function setupClickToAdd() {
  toast('Click anywhere in scene to drop a box', 'info')
}

function animatePhysics() {
  if (currentEngine !== 'physics') return
  physicsFrameId = requestAnimationFrame(animatePhysics)
  physWorld.fixedStep()
  physControls.update()
  for (var i = 0; i < physBodies.length; i++) {
    physMeshes[i].position.copy(physBodies[i].position)
    physMeshes[i].quaternion.copy(physBodies[i].quaternion)
  }
  physRenderer.render(physScene, physCamera)
}

/* -- WEBXR --------------------------------------------------- */
function checkXR() {
  var msg = document.getElementById('xr-msg')
  var btnAR = document.getElementById('btn-ar')
  var btnVR = document.getElementById('btn-vr')
  if (!navigator.xr) {
    msg.textContent = 'WebXR is not supported by your browser. Try Chrome on Android for AR, or a WebXR-capable headset for VR.'
    return
  }
  msg.textContent = 'Checking device capabilities…'
  var arSupported = false, vrSupported = false, checked = 0
  function done() {
    checked++
    if (checked < 2) return
    if (!arSupported && !vrSupported) {
      msg.textContent = 'Your device supports WebXR but AR and VR modes were not detected. This may work on a Meta Quest, or Android Chrome with ARCore.'
    } else {
      msg.textContent = 'WebXR detected! Select a mode below to begin.'
    }
  }
  navigator.xr.isSessionSupported('immersive-ar').then(function(s) { arSupported = s; btnAR.style.display = s ? 'inline-flex' : 'none'; done() }).catch(function() { done() })
  navigator.xr.isSessionSupported('immersive-vr').then(function(s) { vrSupported = s; btnVR.style.display = s ? 'inline-flex' : 'none'; done() }).catch(function() { done() })
}

function enterXR(mode) {
  if (!sceneReady) { toast('Scene Builder must load first', 'err'); return }
  renderer.xr.enabled = true
  navigator.xr.requestSession(mode, { optionalFeatures: ['local-floor','bounded-floor','hand-tracking'] })
    .then(function(session) {
      renderer.xr.setSession(session)
      renderer.setAnimationLoop(function() { renderer.render(scene, camera) })
      session.addEventListener('end', function() { renderer.setAnimationLoop(null) })
      toast('XR session started', 'ok')
    })
    .catch(function(e) { toast('XR failed: ' + e.message, 'err') })
}

/* -- TOAST --------------------------------------------------- */
function toast(msg, type) {
  var el = document.createElement('div')
  el.className = 'toast' + (type ? ' ' + type : '')
  el.textContent = msg
  document.getElementById('toasts').appendChild(el)
  setTimeout(function() { el.remove() }, 2800)
}

/* -- LOAD THREE.JS AS ES MODULE, EXPOSE GLOBALLY -------------
   We use dynamic import then store in globals so regular <script>
   onclick handlers can access THREE, OrbitControls, GLTFLoader     */
(function loadThree() {
  // Inline importmap polyfill approach: use CDN esm.sh which bundles dependencies
  var script = document.createElement('script')
  script.type = 'module'
  script.textContent = [
    "import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169/build/three.module.js'",
    "import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.169/examples/jsm/controls/OrbitControls.js'",
    "import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.169/examples/jsm/loaders/GLTFLoader.js'",
    "window.THREE_MODULE = THREE",
    "window.__OrbitControls = OrbitControls",
    "window.__GLTFLoader = GLTFLoader",
    "initScene(THREE, OrbitControls)",
  ].join('\n')
  document.head.appendChild(script)
})()

// Init with scene engine by default
document.addEventListener('DOMContentLoaded', function() {
  // Keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Delete' && currentEngine === 'scene') deleteSelected()
  })
})
</script>

<!-- -- Guided Tour ------------------------------------ -->
<script>
window.__TOUR_STEPS__ = [{sel:".topbar-logo",title:"Welcome to 3D Studio",body:"A Three.js-powered 3D scene builder. Add shapes, load models, set materials, simulate physics, all in the browser.",tip:"bottom"},{sel:".etabs",title:"5 scene modes",body:"Scene Builder, Model Viewer (GLTF/GLB), Physics simulation, Particle systems, and Camera controls.",tip:"bottom"},{sel:".sidebar",title:"Shapes & materials",body:"Add primitives from the shape grid — cube, sphere, torus, cylinder, plane. Set colour, roughness, metalness and wireframe mode.",tip:"right"},{sel:".main",title:"3D viewport",body:"Orbit with left-click drag, zoom with scroll, pan with right-click drag. Renders in real time via WebGL.",tip:"right"},{sel:".sb-scroll",title:"Physics & lighting",body:"Enable cannon-es gravity to drop objects with real physics. Adjust ambient, directional and point light intensity.",tip:"right"}];
</script>
<script>
(function(){
  'use strict';
  var TOUR_KEY='ui_tour_'+(location.hostname.split('.')[0]||'tool');
  var steps=window.__TOUR_STEPS__||[];
  var current=0,active=false;
  var overlay,tipEl;

  function init(){
    if(!steps.length)return;
    overlay=document.createElement('div');
    overlay.id='tour-overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label','Guided tour');

    var svgNS='http://www.w3.org/2000/svg';
    var svgEl=document.createElementNS(svgNS,'svg');
    svgEl.id='tour-svg';
    svgEl.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9001;pointer-events:none';
    var defs=document.createElementNS(svgNS,'defs');
    var clip=document.createElementNS(svgNS,'clipPath');
    clip.id='tour-clip';
    var outerR=document.createElementNS(svgNS,'rect');
    outerR.setAttribute('width','200%');outerR.setAttribute('height','200%');
    var holeR=document.createElementNS(svgNS,'rect');
    holeR.id='tour-hole';
    clip.appendChild(outerR);clip.appendChild(holeR);defs.appendChild(clip);
    var dimR=document.createElementNS(svgNS,'rect');
    dimR.setAttribute('width','200%');dimR.setAttribute('height','200%');
    dimR.setAttribute('clip-path','url(#tour-clip)');
    dimR.setAttribute('fill','rgba(3,5,10,0.78)');
    var glowR=document.createElementNS(svgNS,'rect');
    glowR.id='tour-glow';
    glowR.setAttribute('fill','none');
    glowR.setAttribute('stroke','rgba(59,130,246,0.55)');
    glowR.setAttribute('stroke-width','2');
    svgEl.appendChild(defs);svgEl.appendChild(dimR);svgEl.appendChild(glowR);
    overlay.appendChild(svgEl);

    tipEl=document.createElement('div');
    tipEl.id='tour-tip';
    tipEl.innerHTML=
      '<div class="tour-progress"><div class="tour-progress-fill" id="tour-pfill"></div></div>'+
      '<div class="tour-step-label" id="tour-slbl"></div>'+
      '<div class="tour-tip-title" id="tour-ttl"></div>'+
      '<div class="tour-tip-body" id="tour-tbdy"></div>'+
      '<div class="tour-footer">'+
        '<div class="tour-dots" id="tour-dots"></div>'+
        '<div class="tour-nav">'+
          '<button class="tour-nav-btn tour-prev" id="tour-prev" onclick="__tourPrev()" aria-label="Previous">&#8592; Prev</button>'+
          '<button class="tour-nav-btn tour-next" id="tour-next" onclick="__tourNext()" aria-label="Next">Next &#8594;</button>'+
        '</div>'+
      '</div>'+
      '<button class="tour-skip" onclick="endTour()">Skip tour &times;</button>';
    overlay.appendChild(tipEl);
    document.body.appendChild(overlay);

    overlay.addEventListener('click',function(e){if(e.target===overlay)endTour();});
    document.addEventListener('keydown',function(e){
      if(!active)return;
      if(e.key==='Escape')endTour();
      if(e.key==='ArrowRight'||e.key==='Enter')__tourNext();
      if(e.key==='ArrowLeft')__tourPrev();
    });

    renderDots();
    var seen=localStorage.getItem(TOUR_KEY);
    if(!seen)setTimeout(function(){startTour();},1500);
  }

  function renderDots(){
    var d=document.getElementById('tour-dots');
    if(!d)return;
    d.innerHTML=steps.map(function(_,i){
      return'<div class="tour-dot'+(i===current?' active':'')+'" onclick="__tourGo('+i+')" tabindex="0" role="button" aria-label="Step '+(i+1)+'"></div>';
    }).join('');
  }

  function spotlight(el){
    if(!el)return;
    var r=el.getBoundingClientRect(),p=10,rx=10;
    var x=r.left-p,y=r.top-p,w=r.width+p*2,h=r.height+p*2;
    var hole=document.getElementById('tour-hole');
    var glow=document.getElementById('tour-glow');
    if(hole){hole.setAttribute('x',x);hole.setAttribute('y',y);hole.setAttribute('width',w);hole.setAttribute('height',h);hole.setAttribute('rx',rx);}
    if(glow){glow.setAttribute('x',x);glow.setAttribute('y',y);glow.setAttribute('width',w);glow.setAttribute('height',h);glow.setAttribute('rx',rx);}
    el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
  }

  function positionTip(el,side){
    if(!tipEl||!el)return;
    tipEl.className='';
    var r=el.getBoundingClientRect();
    var tw=tipEl.offsetWidth||320,th=tipEl.offsetHeight||220;
    var vw=window.innerWidth,vh=window.innerHeight,m=16;
    var top,left,arrow;
    if(side==='bottom'&&r.bottom+th+m<vh){top=r.bottom+m;left=r.left;arrow='top';}
    else if(side==='top'&&r.top-th-m>0){top=r.top-th-m;left=r.left;arrow='bottom';}
    else if(side==='right'&&r.right+tw+m<vw){top=r.top;left=r.right+m;arrow='left';}
    else if(side==='left'&&r.left-tw-m>0){top=r.top;left=r.left-tw-m;arrow='right';}
    else{top=Math.min(r.bottom+m,vh-th-m);left=r.left;arrow='top';}
    left=Math.max(m,Math.min(left,vw-tw-m));
    top=Math.max(m+56,Math.min(top,vh-th-m));
    tipEl.style.top=top+'px';tipEl.style.left=left+'px';
    tipEl.classList.add('arrow-'+arrow);
  }

  function renderStep(idx){
    if(idx<0||idx>=steps.length)return;
    current=idx;
    var step=steps[idx],total=steps.length;
    var el=step.sel?document.querySelector(step.sel):null;
    document.getElementById('tour-slbl').textContent='Step '+(idx+1)+' of '+total;
    document.getElementById('tour-ttl').textContent=step.title||'';
    document.getElementById('tour-tbdy').textContent=step.body||'';
    var pf=document.getElementById('tour-pfill');
    if(pf)pf.style.width=Math.round(((idx+1)/total)*100)+'%';
    var prev=document.getElementById('tour-prev');
    var next=document.getElementById('tour-next');
    if(prev)prev.style.display=idx===0?'none':'';
    if(next)next.textContent=idx===total-1?'Finish \u2713':'Next \u2192';
    document.querySelectorAll('.tour-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
    if(el){
      spotlight(el);
      setTimeout(function(){positionTip(el,step.tip||'bottom');},80);
    }else{
      var hole=document.getElementById('tour-hole');
      if(hole){hole.setAttribute('width','0');hole.setAttribute('height','0');}
      tipEl.style.top='50%';tipEl.style.left='50%';
      tipEl.style.transform='translate(-50%,-50%)';
    }
  }

  window.__tourGo=function(i){if(active)renderStep(i);};
  window.__tourNext=function(){if(!active)return;if(current>=steps.length-1){endTour();return;}renderStep(current+1);};
  window.__tourPrev=function(){if(active&&current>0)renderStep(current-1);};

  window.startTour=function(){
    if(!steps.length)return;
    active=true;current=0;
    overlay.classList.add('active');
    document.body.style.overflow='hidden';
    renderStep(0);
  };

  window.endTour=function(){
    active=false;
    if(overlay)overlay.classList.remove('active');
    document.body.style.overflow='';
    localStorage.setItem(TOUR_KEY,'1');
  };

  window.resetTour=function(){localStorage.removeItem(TOUR_KEY);};

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init);
  }else{
    setTimeout(init,0);
  }
})();

</script>
</body>
